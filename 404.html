<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Denys Sulinskyi</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
  <style>
    .nf { max-width: 560px; margin: 0 auto; padding: 120px 24px 80px; text-align: center; }
    .nf-code { font-family: 'JetBrains Mono', monospace; font-size: 86px; font-weight: 700;
               color: var(--dd-green); line-height: 1; letter-spacing: -2px; }
    .nf-rule { width: 64px; height: 2px; background: var(--dd-green); margin: 28px auto; }
    .nf-line { color: var(--text-muted); font-size: 16px; line-height: 1.5; margin-bottom: 10px; }
    .nf-line[lang="en"] { color: #fff; font-weight: 600; }
    .nf-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
    .nf-links a { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-decoration: none;
                  color: #fff; border: 1px solid var(--border-subtle); border-radius: 20px;
                  padding: 10px 20px; transition: border-color 0.2s, color 0.2s; }
    .nf-links a:hover { border-color: var(--dd-green); color: var(--dd-green); }
  </style>
</head>
<body>
  <div class="nf">
    <div class="nf-code">404</div>
    <div class="nf-rule"></div>
    <p class="nf-line" lang="en">This page doesn't exist.</p>
    <p class="nf-line" lang="uk">Такої сторінки не існує.</p>
    <p class="nf-line" lang="ru">Такой страницы не существует.</p>
    <div class="nf-links">
      <a href="/">EN — Home</a>
      <a href="/uk/">UA — Головна</a>
      <a href="/ru/">RU — Главная</a>
    </div>
  </div>
</body>
</html>
